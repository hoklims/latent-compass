name: Build attested release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          python-version: '3.13'
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Build distributions from tag
        run: uv build --no-sources
      - name: Test extracted source distribution
        run: uv run --frozen python tools/verify_sdist.py dist/latent_compass-*.tar.gz
      - name: Verify installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: uv run --no-project --isolated --python 3.13 --with "${{ github.workspace }}/dist/"*.whl latent-compass shadow --help
      - name: Attest exact release artifacts
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-path: dist/*
      - name: Retain exact release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish exact attested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
